<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>deskwalk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233DDC84'/%3E%3Cpath d='M6 22h20M9 18l4-8 4 6 3-4 3 6' fill='none' stroke='%2304140B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // apply stored theme before the first paint
  try { const t = localStorage.getItem("dw-theme"); if (["system", "dark", "light"].includes(t)) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px;
  --radius: 16px; --radius-s: 12px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t: 200ms;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sidebar: 224px;
  /* dark (default) */
  --bg: #0B0D10; --card: #14171C; --card-2: #1A1E24; --line: #22262D; --line-2: #2C313A;
  --text: #E9EDF2; --muted: #8E98A4; --faint: #646D78;
  --accent: #3DDC84; --accent-text: #3DDC84; --accent-ink: #04140B; --accent-soft: rgba(61, 220, 132, .12);
  --danger: #F2564F; --danger-ink: #1E0505; --danger-soft: rgba(242, 86, 79, .12);
  --heat-0: #1A1E24;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F3F4F6; --card: #FFFFFF; --card-2: #F1F3F5; --line: #E1E4E9; --line-2: #D3D7DE;
  --text: #0B0D10; --muted: #5B6470; --faint: #858E99;
  --accent-text: #138A4B; --accent-soft: rgba(61, 220, 132, .16);
  --danger: #D93A33; --danger-ink: #FFFFFF; --danger-soft: rgba(217, 58, 51, .10);
  --heat-0: #EBEDF0;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    --bg: #F3F4F6; --card: #FFFFFF; --card-2: #F1F3F5; --line: #E1E4E9; --line-2: #D3D7DE;
    --text: #0B0D10; --muted: #5B6470; --faint: #858E99;
    --accent-text: #138A4B; --accent-soft: rgba(61, 220, 132, .16);
    --danger: #D93A33; --danger-ink: #FFFFFF; --danger-soft: rgba(217, 58, 51, .10);
    --heat-0: #EBEDF0;
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }
body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: not-allowed; opacity: .38; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* layout */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; padding: var(--s3) var(--s2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s1); }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; padding: 0 var(--s1) var(--s3); }
.nav-btn { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--muted); font-weight: 550; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.nav-btn:hover { color: var(--text); background: var(--card); }
.nav-btn.active { color: var(--text); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.nav-btn.active svg { color: var(--accent-text); }
.sidebar .foot { margin-top: auto; padding: 0 var(--s1); color: var(--faint); font-size: 12px; }

.page { min-width: 0; padding: 0 var(--s4) var(--s5); }
.topbar { position: sticky; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; gap: var(--s2); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * var(--s4)) var(--s3); padding: 0 var(--s4); }
.conn { display: flex; align-items: center; gap: 10px; font-weight: 550; min-width: 0; }
.conn-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none; }
.dot.ok { background: var(--accent); }
.dot.busy { animation: blink 1s ease-in-out infinite alternate; }
@keyframes blink { to { opacity: .3; } }
.sep { width: 1px; height: 20px; background: var(--line); flex: none; }
.mode-label { color: var(--muted); white-space: nowrap; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
.clock { font-size: 15px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); transition: color var(--t), background var(--t); }
.icon-btn:hover { color: var(--text); background: var(--card); }

.view { display: none; animation: fade var(--t) var(--ease); }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); margin: 0 0 var(--s3); flex-wrap: wrap; }
.view-head h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s3); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s2); }
.card-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin: 0; }
.stack { display: grid; gap: var(--s3); align-content: start; min-width: 0; }
.banner { display: none; align-items: center; gap: 12px; padding: 12px var(--s2); border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--card); margin-bottom: var(--s3); }
.banner.show { display: flex; }
.banner.error { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); background: var(--danger-soft); }
.banner .grow { flex: 1; min-width: 0; }

.btn { height: 40px; padding: 0 var(--s2); border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; transition: background var(--t) var(--ease), border-color var(--t), transform 80ms; }
.btn:hover:not(:disabled) { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.small { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }

/* training */
.training { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: var(--s3); align-items: start; }
.hero { display: grid; justify-items: center; padding: var(--s4) var(--s3) var(--s3); }
.ring-wrap { position: relative; width: min(380px, 100%); aspect-ratio: 1; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; }
.speed { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -.04em; font-size: clamp(120px, 11vw, 156px); line-height: 1; transition: color var(--t) var(--ease); }
.hero.running .speed { color: var(--accent-text); }
.hero.stale .speed { opacity: .4; }
.unit { color: var(--muted); font-size: 15px; font-weight: 550; letter-spacing: .06em; margin-top: var(--s1); }
.target { font-family: var(--mono); font-size: 14px; color: var(--muted); height: 20px; margin-top: var(--s1); }
.target.on { color: var(--accent-text); }
.goal-line { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s1) var(--s3); margin-top: var(--s3); color: var(--muted); font-size: 14px; }
.goal-line b { color: var(--text); font-weight: 600; }
.session-line { margin-top: var(--s1); color: var(--faint); font-size: 13px; height: 18px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
.tile { padding: var(--s2) var(--s3) var(--s3); }
.tile .label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tile .value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-top: var(--s1); white-space: nowrap; }
.tile .sub { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--faint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.controls { display: grid; gap: var(--s3); }
.ctrl-row { display: flex; align-items: center; justify-content: center; gap: var(--s4); }
.round { border-radius: 50%; display: flex; align-items: center; justify-content: center; line-height: 1; border: 1px solid var(--line); background: var(--card-2); transition: background var(--t) var(--ease), border-color var(--t), transform 80ms, color var(--t); }
.round:hover:not(:disabled) { border-color: var(--line-2); }
.round:active:not(:disabled) { transform: scale(.96); }
.round.step { width: 72px; height: 72px; }
.round.step svg { width: 28px; height: 28px; stroke-width: 2.2; }
.round.go { width: 128px; height: 128px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 18px; letter-spacing: .06em; }
.round.go.stop { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }

.slider-box { display: grid; gap: var(--s1); }
.slider-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--faint); }
.slider-scale b { color: var(--text); font-weight: 600; font-size: 13px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: var(--text); border: 4px solid var(--card); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 4px solid var(--card); }
input[type=range]:disabled { opacity: .38; cursor: not-allowed; }

.quick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s1); }
.chip { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); font-weight: 600; font-size: 14px; white-space: nowrap; transition: background var(--t) var(--ease), border-color var(--t), color var(--t); }
.chip:hover:not(:disabled) { border-color: var(--line-2); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-text); }

.chart { width: 100%; height: 240px; display: block; }
.chart-wrap { position: relative; }
.chart-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 14px; pointer-events: none; }
.chart text, .bars text { fill: var(--faint); font-family: var(--mono); font-size: 10px; }
.chart .grid, .bars .grid { stroke: var(--line); }
.chart .speed-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart .speed-area { fill: var(--accent-soft); stroke: none; }
.chart .cad-line { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.legend { display: flex; gap: var(--s2); font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--accent); }
.legend i.alt { background: var(--muted); }

.prog-name { font-weight: 600; font-size: 16px; }
.prog-meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--s1); color: var(--muted); font-size: 13px; }
.prog-big { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
.segbar { display: flex; gap: 3px; height: 28px; align-items: flex-end; margin-top: var(--s2); }
.segbar span { flex: var(--w) 1 0; min-width: 3px; background: var(--line-2); border-radius: 3px; height: var(--h); position: relative; overflow: hidden; }
.segbar span.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.segbar span.now::after { content: ""; position: absolute; inset: 0; width: var(--fill, 0%); background: var(--accent); transition: width 1s linear; }
.row-gap { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s2); }
select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); padding: 0 12px; min-width: 0; flex: 1; }

.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.mini-stats div { display: grid; gap: 2px; }
.mini-stats span { font-size: 12px; color: var(--muted); }
.mini-stats b { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.notice { display: flex; gap: 12px; align-items: flex-start; }
.notice p { margin: 0; color: var(--muted); font-size: 14px; }
.notice strong { color: var(--text); }

/* history */
.bars { width: 100%; height: 220px; display: block; }
.bars rect.bar { fill: var(--accent); opacity: .5; }
.bars rect.bar.hit { opacity: 1; }
.bars line.goal { stroke: var(--muted); stroke-dasharray: 4 4; }
.heat-scroll { overflow-x: auto; padding-bottom: var(--s1); }
.heat { display: grid; grid-template-columns: 28px repeat(53, minmax(11px, 1fr)); grid-template-rows: 16px repeat(7, auto); gap: 3px; width: 100%; min-width: 780px; }
.heat .m { font-size: 10px; color: var(--faint); font-family: var(--mono); grid-row: 1; white-space: nowrap; }
.heat .wd { font-size: 10px; color: var(--faint); font-family: var(--mono); grid-column: 1; align-self: center; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
.heat i.l1, .heat-legend .l1 { background: rgba(61, 220, 132, .28); }
.heat i.l2, .heat-legend .l2 { background: rgba(61, 220, 132, .5); }
.heat i.l3, .heat-legend .l3 { background: rgba(61, 220, 132, .75); }
.heat i.l4, .heat-legend .l4 { background: var(--accent); }
.heat-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 12px; color: var(--faint); margin-top: var(--s1); }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; background: var(--heat-0); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 var(--s1) var(--s1); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { height: 56px; padding: 0 var(--s1); border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.act { text-align: right; }
td.act .btn { margin-left: 4px; }
.open-tag { color: var(--accent-text); font-size: 12px; font-weight: 600; margin-left: var(--s1); }
.empty { color: var(--faint); padding: var(--s3) 0; text-align: center; }

/* records */
.records { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.record .big { font-family: var(--mono); font-size: 40px; font-weight: 600; letter-spacing: -.03em; margin: var(--s1) 0 4px; }
.record .big small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 6px; letter-spacing: 0; }
.record .when { color: var(--faint); font-size: 13px; }

/* settings, programs */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); align-items: start; }
.field { display: grid; gap: var(--s1); padding: var(--s2) 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; padding-top: 0; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.field-head label, .field-head strong { font-weight: 600; }
.field-head em { font-style: normal; color: var(--faint); font-size: 12px; white-space: nowrap; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.seg button { height: 34px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; transition: background var(--t), color var(--t); }
.seg button:hover:not(:disabled) { color: var(--text); }
.seg button.on { background: var(--card-2); color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--line-2); }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1); }
input[type=number], input[type=text] { height: 40px; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-variant-numeric: tabular-nums; transition: border-color var(--t); }
input[type=text] { font-family: var(--font); }
input:focus { border-color: var(--line-2); outline: none; }
.switch { display: flex; gap: var(--s2); align-items: flex-start; cursor: pointer; padding: var(--s2) 0; border-top: 1px solid var(--line); }
.switch.first { border-top: 0; padding-top: 0; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--line); position: relative; transition: background var(--t) var(--ease); margin-top: 1px; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); transition: transform var(--t) var(--ease); }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch b { display: block; font-weight: 600; }
.switch small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.switch small.danger { color: var(--danger); }
.cal-list { display: grid; gap: var(--s1); }
.cal-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--s2); padding: 12px var(--s2); border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--card-2); }
.cal-item .num { font-size: 14px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: var(--w, 0%); transition: width 600ms var(--ease); }
.meter.due i { background: var(--danger); }
.programs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.program .segbar { height: 40px; }
.program .segbar span { background: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.program .row-gap { justify-content: flex-end; }
.seg-rows { display: grid; gap: var(--s1); }
.seg-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 36px; gap: var(--s1); align-items: center; }
.seg-row .idx { color: var(--faint); font-family: var(--mono); font-size: 13px; }
.seg-row label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }

/* status */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 12px var(--s3); font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { font-family: var(--mono); font-size: 12px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s); padding: var(--s2); max-height: 560px; overflow: auto; white-space: pre; margin: 0; color: var(--muted); }
.log.wrap { white-space: pre-wrap; word-break: break-word; }
.log .w { color: var(--text); }
.log .e { color: var(--danger); }

/* dialog, toast, tab bar */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .55); display: none; place-items: center; padding: var(--s2); }
.overlay.show { display: grid; animation: fade var(--t) var(--ease); }
.dialog { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s3); display: grid; gap: var(--s2); }
.dialog h2 { margin: 0; font-size: 18px; font-weight: 650; }
.dialog p { margin: 0; color: var(--muted); font-size: 14px; }
.countdown { font-family: var(--mono); font-size: 96px; font-weight: 600; text-align: center; letter-spacing: -.04em; line-height: 1.1; }
.dialog .actions { display: flex; justify-content: flex-end; gap: var(--s1); margin-top: var(--s1); }
.toast { position: fixed; left: 50%; bottom: calc(var(--s3) + env(safe-area-inset-bottom)); z-index: 30; transform: translate(-50%, 12px); background: var(--card-2); border: 1px solid var(--line-2); padding: 12px var(--s2); border-radius: var(--radius-s); opacity: 0; pointer-events: none; transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); max-width: calc(100vw - 32px); font-size: 14px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.tabbar { display: none; }

@media (max-width: 1360px) { .training { grid-template-columns: minmax(0, 1fr) 360px; } .tile .value { font-size: 26px; } }
@media (max-width: 1180px) { .training { grid-template-columns: minmax(0, 1fr); } .records { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .page { padding: 0 var(--s2) calc(88px + env(safe-area-inset-bottom)); }
  .topbar { margin: 0 calc(-1 * var(--s2)) var(--s2); padding: 0 var(--s2); gap: 12px; }
  .grid2, .programs { grid-template-columns: minmax(0, 1fr); }
  .tabbar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar .nav-btn { flex-direction: column; height: auto; gap: 4px; padding: 6px 0; font-size: 11px; justify-content: center; box-shadow: none; background: none; min-width: 0; }
  .tabbar .nav-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (max-width: 600px) {
  .card { padding: var(--s2); }
  .hero { padding: var(--s3) var(--s2) var(--s2); }
  .ring-wrap { width: min(340px, 100%); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile { padding: var(--s2); }
  .tile .value { font-size: 26px; }
  .ctrl-row { gap: var(--s3); }
  .round.go { width: 112px; height: 112px; }
  .round.step { width: 64px; height: 64px; }
  .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .records { grid-template-columns: minmax(0, 1fr); }
  .record .big { font-size: 34px; }
  #simBadge { display: none; }
  .topbar .right { gap: 12px; }
  .view-head h1 { font-size: 20px; }
  .hide-s { display: none; }
  .countdown { font-size: 80px; }
  .log { white-space: pre-wrap; word-break: break-word; }
  .kv dd { white-space: normal; word-break: break-word; }
  #sessTable thead { display: none; }
  #sessTable tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  #sessTable tr:last-child { border-bottom: 0; }
  #sessTable td { height: auto; border: 0; padding: 0; white-space: normal; }
  #sessTable td.act { grid-column: 1 / -1; text-align: left; margin-top: var(--s1); }
  #sessTable td.act .btn { margin: 0 var(--s1) 0 0; }
  #sessTable td.empty { grid-column: 1 / -1; }
}
.preload, .preload * { transition: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

// ── Helpers ────────────────────────────────────────────

const ms = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const hm = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}`; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// ── Units: the belt and the server work in metric; convert only for display and input ──

  speedOut: (kmh) => (imp() ? kmh / KM_PER_MI : kmh), speedIn: (v) => (imp() ? v * KM_PER_MI : v),
  distOut: (km) => (imp() ? km / KM_PER_MI : km), distIn: (v) => (imp() ? v * KM_PER_MI : v),
  weightOut: (kg) => (imp() ? kg / KG_PER_LB : kg), weightIn: (v) => (imp() ? v * KG_PER_LB : v),

// count numbers smoothly to the new value
function tween(el, to, fmt, dur = 450) {
  if (!el) return;
  if (el._to === to && el._fmt === fmt.toString() + LANG + UNITS) return;
  const from = el._to === undefined || el._fmt !== fmt.toString() + LANG + UNITS ? to : el._cur ?? to;
  el._to = to; el._fmt = fmt.toString() + LANG + UNITS;
  cancelAnimationFrame(el._raf);
  if (from === to || document.hidden) { el._cur = to; el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el._cur = from + (to - from) * e;
    el.textContent = fmt(el._cur);
    if (k < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

let toastTimer;

}

async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (data.state) render(data.state);
    return data;
  } catch (e) { return { ok: false, key: "err_server" }; }
}
async function cmd(name, args = {}, quiet = false) {
  const d = await post("/cmd", { cmd: name, ...args });
  if (!d.ok) toast(tMsg(d), true); else if (!quiet) toast(tMsg(d));
  return !!d.ok;
}
async function saveSettings(body, quietKey) {
  const d = await post("/settings", body);
  if (!d.ok) toast(tMsg(d), true); else if (!quietKey) toast(tMsg(d));
  return !!d.ok;
}

// ── State ──────────────────────────────────────────────
let S = null, lastStateAt = 0;
let target = null, targetUntil = 0, sendTimer = null, dragging = false, busy = false;
const connected = () => !!(S && S.connected);
const running = () => !!(S && S.belt && S.belt.running);
function baseSpeed() { if (target !== null) return target; if (running()) return S.belt.speed; return S ? S.last_speed : 2; }

function setTarget(kmh, delay = 300) {

  clearTimeout(sendTimer); sendTimer = setTimeout(() => cmd("speed", { speed: target }, true), delay);
}
// ± 0.1 in the displayed unit, then back to km/h (belt resolution is 0.1 km/h)
function nudge(dir) {
  if (!connected()) return;
  const shown = Math.round(U.speedOut(baseSpeed()) * 10) / 10;
  let next = clampKmh(U.speedIn(shown + dir * 0.1));
  if (next === baseSpeed()) next = clampKmh(next + dir * 0.1);
  setTarget(next);
}
function toggleStartStop() {
  if (!connected() || busy) return;
  busy = true; cmd(running() ? "stop" : "start").finally(() => (busy = false));
}

// ── Live chart (SVG) ───────────────────────────────────
let chartSession = null, chartPts = [], chartLoading = false;
async function loadChart() {
  if (chartLoading) return;
  chartLoading = true;
  const d = await getJSON("/history?session=current");
  chartLoading = false;
  chartSession = d ? d.id : null;
  chartPts = d ? d.samples.map((p) => [p.ts, p.speed, p.cadence]) : [];
  drawChart();
}
function liveChart() {
  const sess = S.session;
  if (!sess) { $("#chartEmpty").classList.toggle("hidden", chartPts.length > 0); return; }
  if (sess.id !== chartSession) { loadChart(); return; }
  const now = Date.now() / 1000;
  if (!chartPts.length || now - chartPts[chartPts.length - 1][0] >= 2) { chartPts.push([now, S.belt ? S.belt.speed : 0, S.cadence]); drawChart(); }
}
function drawChart() {
  const svg = $("#chart");
  $("#chartEmpty").classList.toggle("hidden", chartPts.length > 0);
  const W = Math.max(240, Math.round(svg.clientWidth || 360)), H = 240, L = 30, R = 36, T = 10, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (chartPts.length < 2) { svg.innerHTML = ""; return; }
  const step = Math.max(1, Math.floor(chartPts.length / 600));
  const pts = chartPts.filter((_, i) => i % step === 0 || i === chartPts.length - 1);
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0], span = Math.max(60, t1 - t0);
  // round ticks: metric 0–6 km/h in steps of 2, imperial 0–4 mph in steps of 1; cadence on the same lines
  const n = imp() ? 4 : 3, vMax = imp() ? 4 : 6;
  const cStep = Math.ceil(Math.max(120, ...pts.map((p) => p[2])) / n / 10) * 10, cMax = cStep * n;
  const x = (ts) => L + ((ts - t0) / span) * (W - L - R);
  const ys = (v) => T + (H - T - B) * (1 - Math.min(vMax, U.speedOut(v)) / vMax);
  const yc = (c) => T + (H - T - B) * (1 - Math.min(cMax, c) / cMax);
  const elapsed = (sec) => (span >= 3600 ? hm(sec) + " h" : ms(sec));
  const sessionStart = S && S.session ? S.session.start_ts : t0;
  let g = "";
  for (let i = 0; i <= n; i++) {
    const y = T + (H - T - B) * (1 - i / n);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${nf((vMax / n) * i, 0)}</text><text x="${W - R + 6}" y="${y + 3}">${nf(cStep * i, 0)}</text>`;
  }
  for (let i = 0; i <= 3; i++) {
    const ts = t0 + (span / 3) * i;

function goal() { return S ? S.settings.goal : { type: "steps", value: 8000 }; }
function renderBars() {
  if (!HIST || currentView !== "history") return;
  const byDay = Object.fromEntries(HIST.days.map((d) => [d.day, d]));
  const days = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(isoDay(d)); }
  const g = goal(), goalD = g.type === "km" ? U.distOut(g.value) : null;
  const val = (d) => (byDay[d] ? U.distOut(byDay[d].km) : 0);
  const max = Math.max(1, goalD || 0, ...days.map(val));
  const svg = $("#bars");
  const W = Math.max(280, Math.round(svg.clientWidth || 900)), H = 220, L = 30, B = 22, T = 8, bw = (W - L) / 30;
  const labelEvery = W < 500 ? 7 : 5;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const step = max > 8 ? 2 : max > 4 ? 1 : 0.5;
  let out = "";
  for (let v = 0; v <= max + 1e-9; v += step) out += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${nf(v, step < 1 ? 1 : 0)}</text>`;
  days.forEach((d, i) => {
    const v = val(d), x = L + i * bw + bw * 0.18, hgt = Math.max(v > 0 ? 2 : 0, H - B - y(v));
    const hit = byDay[d] && (g.type === "km" ? byDay[d].km >= g.value : byDay[d].steps >= g.value);
    out += `<rect class="bar${hit ? " hit" : ""}" x="${x}" y="${H - B - hgt}" width="${bw * 0.64}" height="${hgt}" rx="2"><title>${dayFmt(d)}: ${nf(v, 2)} ${U.dist()}</title></rect>`;
    if ((29 - i) % labelEvery === 0) {
      const last = i === 29, label = new Date(d + "T12:00:00").toLocaleDateString(locale(), { day: "2-digit", month: "2-digit" });
      out += `<text x="${last ? W : x + bw * 0.32}" y="${H - 6}" text-anchor="${last ? "end" : "middle"}">${label}</text>`;
    }
  });
  if (goalD) out += `<line class="goal" x1="${L}" x2="${W}" y1="${y(goalD)}" y2="${y(goalD)}"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  setText($("#histSum"), t("hist_sum", { v: fmtDist(days.reduce((a, d) => a + (byDay[d] ? byDay[d].km : 0), 0), 1) }));
}
new ResizeObserver(renderBars).observe($("#bars"));
function renderHeat() {
  const byDay = Object.fromEntries(HIST.days.map((d) => [d.day, d.km]));
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 52 * 7 - ((today.getDay() + 6) % 7));
  const vals = Object.values(byDay).filter((v) => v > 0).sort((a, b) => a - b);
  const q = (p) => (vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 1);
  const th = [q(0.25), q(0.5), q(0.75)];
  // weekday names from the browser locale (2024-01-01 was a Monday)
  const wd = [0, 2, 4].reduce((a, i) => ((a[i] = new Date(2024, 0, 1 + i).toLocaleDateString(locale(), { weekday: "short" })), a), Array(7).fill(""));
  let html = "", lastMonth = -1, total = 0, active = 0;
  wd.forEach((w, i) => (html += `<span class="wd" style="grid-row:${i + 2}">${w}</span>`));
  const d = new Date(start);
  for (let col = 0; col < 53; col++) {
    for (let row = 0; row < 7; row++) {
      if (d > today) break;
      const iso = isoDay(d), v = byDay[iso] || 0;
      if (row === 0 && d.getMonth() !== lastMonth && d.getDate() <= 7) {
        lastMonth = d.getMonth();
        html += `<span class="m" style="grid-column:${col + 2}">${d.toLocaleDateString(locale(), { month: "short" })}</span>`;
      }
      const lv = v <= 0 ? 0 : v <= th[0] ? 1 : v <= th[1] ? 2 : v <= th[2] ? 3 : 4;
      if (v > 0) { total += v; active++; }
      html += `<i class="${lv ? "l" + lv : ""}" style="grid-column:${col + 2};grid-row:${row + 2}" title="${dayFmt(iso)}: ${esc(fmtDist(v))}"></i>`;
      d.setDate(d.getDate() + 1);
    }
  }
  $("#heat").innerHTML = html;
  setText($("#heatSum"), t("heat_sum", { v: fmtDist(total, 1), n: active }));
  const sc = $("#heatScroll"); sc.scrollLeft = sc.scrollWidth;
}

// export, built in the browser (data stays metric)
async function exportSession(id, kind) {
  const s = await getJSON(`/history?session=${id}`);
  if (!s) { toast(t("err_not_found_session"), true); return; }
  const stamp = new Date(s.start_ts * 1000), pad = (n) => String(n).padStart(2, "0");
  const base = `deskwalk_${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())}_${pad(stamp.getHours())}${pad(stamp.getMinutes())}`;
  let text, type;
  if (kind === "csv") {
    text = "time,seconds,speed_kmh,cadence_spm\n" + s.samples.map((p) => `${new Date(p.ts * 1000).toISOString()},${Math.round(p.ts - s.start_ts)},${p.speed.toFixed(1)},${p.cadence}`).join("\n") + "\n";
    type = "text/csv";
  } else {
    const iso = (ts) => new Date(ts * 1000).toISOString().replace(/\.\d{3}Z$/, "Z");
    const dist = (i) => s.samples.slice(0, i + 1).reduce((a, p, j, arr) => a + (j ? (p.speed / 3.6) * (p.ts - arr[j - 1].ts) : 0), 0);
    const tps = s.samples.map((p, i) => `<Trackpoint><Time>${iso(p.ts)}</Time><DistanceMeters>${dist(i).toFixed(1)}</DistanceMeters><Extensions><ns3:TPX><ns3:Speed>${(p.speed / 3.6).toFixed(3)}</ns3:Speed><ns3:RunCadence>${Math.round(p.cadence / 2)}</ns3:RunCadence></ns3:TPX></Extensions></Trackpoint>`).join("");
    text = `<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2"><Activities><Activity Sport="Other"><Id>${iso(s.start_ts)}</Id><Lap StartTime="${iso(s.start_ts)}"><TotalTimeSeconds>${Math.round(s.active_s)}</TotalTimeSeconds><DistanceMeters>${(s.distance_km * 1000).toFixed(1)}</DistanceMeters><MaximumSpeed>${(s.max_speed / 3.6).toFixed(3)}</MaximumSpeed><Calories>${Math.round(s.calories)}</Calories><Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod><Track>${tps}</Track></Lap><Notes>Treadmill walk, ${Math.round(s.own_steps)} steps</Notes></Activity></Activities></TrainingCenterDatabase>\n`;
    type = "application/vnd.garmin.tcx+xml";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = `${base}.${kind}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function notify(text) {
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(t("reminder_title"), { body: text, tag: "deskwalk-reminder" }); return; } catch (e) { /* fall back to the toast */ }
  }
  toast(`${t("reminder_title")}: ${text}`);
}
function checkReminder() {
  const rem = S.settings.reminder;
  if (!rem.enabled || running()) return;
  const now = Date.now() / 1000, last = Math.max(S.last_walk_ts || 0, S.app_started_ts || 0), limit = rem.minutes * 60;
  if (now - last >= limit && now - lastReminder >= limit) { lastReminder = now; notify(t("reminder_text", { m: rem.minutes })); }
}

// ── Calibration dialog ─────────────────────────────────
const cal = { phase: 0, timer: null, speeds: [], left: null, speed: 3, t0: 0, measured: 0 };
function calShow(step) {
  [1, 2, 3].forEach((i) => $(`#calStep${i}`).classList.toggle("hidden", i !== step));
  setText($("#calNext"), step === 1 ? t("cal_go") : step === 2 ? t("cal_running") : t("save"));
  $("#calNext").disabled = step === 2;
  cal.phase = step;
}
$("#calOpen").addEventListener("click", () => {
  if (!connected()) { toast(t("connect_first"), true); return; }
  $("#calSpeed").value = round1(U.speedOut(running() ? S.belt.speed : 3));
  $("#calSteps").value = "";
  calShow(1); $("#calDialog").classList.add("show");
});
function calClose() { clearInterval(cal.timer); cal.timer = null; cal.phase = 0; $("#calDialog").classList.remove("show"); }
$("#calCancel").addEventListener("click", calClose);
$("#calNext").addEventListener("click", async () => {
  if (cal.phase === 1) {
    cal.speed = clampKmh(U.speedIn(numVal("#calSpeed") || 3));
    calShow(2); setText($("#calHint"), t("cal_setting")); setText($("#calCount"), "60");
    $("#calMeter").style.setProperty("--w", "0%");
    await cmd("speed", { speed: cal.speed }, true);
    if (!running()) await cmd("start", {}, true);
    if (running() && Math.abs(S.belt.speed - cal.speed) > 0.05) await cmd("speed", { speed: cal.speed }, true);
    cal.left = null; cal.speeds = [];
    cal.timer = setInterval(() => {
      if (!connected()) { calClose(); toast(t("cal_lost"), true); return; }
      if (cal.left === null) {
        if (running() && Math.abs(S.belt.speed - cal.speed) < 0.15) { cal.left = 60; cal.t0 = Date.now(); setText($("#calHint"), t("cal_count_now", { speed: cal.speed })); }
        return;
      }
      cal.speeds.push(S.belt.speed);
      cal.left = Math.max(0, 60 - Math.floor((Date.now() - cal.t0) / 1000));
      setText($("#calCount"), String(cal.left));
      $("#calMeter").style.setProperty("--w", `${((60 - cal.left) / 60) * 100}%`);
      if (cal.left === 0) {
        clearInterval(cal.timer); cal.timer = null;
        cal.measured = cal.speeds.reduce((a, b) => a + b, 0) / cal.speeds.length;
        setText($("#calDone"), t("cal_done", { speed: cal.measured }));
        calShow(3); $("#calSteps").focus();
      }
    }, 250);
  } else if (cal.phase === 3) {
    const steps = parseInt($("#calSteps").value, 10);
    if (!(steps >= 10)) { toast(t("enter_steps"), true); return; }
    if (await cmd("calibrate", { speed: cal.measured, steps, seconds: 60 })) calClose();
  }
});

// ── Status ─────────────────────────────────────────────
function renderStatus() {
  if (!S) return;
  const L = S.link;
  const rows = [
    [t("st_state"), connLabel()], [t("st_message"), tMsg(S.message) || "–"], [t("st_device"), (S.device && S.device.name) || "–"],
    [t("st_last_reply"), S.status_age != null ? t("ago_s", { v: nf(S.status_age, 1) }) : "–"],
    [t("st_latency"), L.latency_ms != null ? `${L.latency_ms} ms` : "–"], [t("st_since"), L.connected_since ? timeFmt(L.connected_since) : "–"],
    [t("st_packets"), nf(L.packets)], [t("st_drops"), `${L.connects} / ${L.drops}`], [t("st_attempts"), String(S.attempt)],
  ];
  const kv = $("#statusKv"), html = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd title="${esc(v)}">${esc(v)}</dd>`).join("");
  if (kv.dataset.h !== html) { kv.innerHTML = html; kv.dataset.h = html; }
  setText($("#connBtn"), S.want_connected ? t("disconnect") : t("connect"));
  $("#connBtn").classList.toggle("primary", !S.want_connected);
  const ev = S.events.map((e) => `<span class="${e.level === "warning" ? "w" : e.level === "error" ? "e" : ""}">${new Date(e.t * 1000).toLocaleTimeString(locale())}  ${esc(t(e.key, e.args))}</span>`).join("\n") || esc(t("nothing_yet"));
  const evEl = $("#events");
  if (evEl.dataset.h !== ev) { evEl.innerHTML = ev; evEl.dataset.h = ev; }
}
function renderLog() {
  if (currentView !== "status") return;
  const box = $("#log"), atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.innerHTML = logLines.map((l) => `<span class="${/ERROR|CRITICAL/.test(l) ? "e" : /WARNING/.test(l) ? "w" : ""}">${esc(l)}</span>`).join("\n") || "–";
  if (atBottom) box.scrollTop = box.scrollHeight;
}
$("#connBtn").addEventListener("click", () => cmd(S && S.want_connected ? "disconnect" : "connect"));
$("#bannerBtn").addEventListener("click", () => cmd("connect"));
$("#forgetBtn").addEventListener("click", () => cmd("forget_device"));

// ── Training controls ──────────────────────────────────
$("#startStop").addEventListener("click", toggleStartStop);
$("#minus").addEventListener("click", () => nudge(-1));
$("#plus").addEventListener("click", () => nudge(1));
$$("[data-quick]").forEach((b) => b.addEventListener("click", () => setTarget(quickKmh(b), 0)));
$("#meetingBtn").addEventListener("click", () => cmd("meeting"));
$("#pauseBtn").addEventListener("click", () => cmd("pause"));
const slider = $("#slider");
slider.addEventListener("pointerdown", () => (dragging = true));
slider.addEventListener("input", () => { dragging = true; setTarget(U.speedIn(parseFloat(slider.value)), 350); });
slider.addEventListener("change", () => { dragging = false; setTarget(U.speedIn(parseFloat(slider.value)), 0); });
window.addEventListener("pointerup", () => (dragging = false));
document.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) b.blur(); });

// keyboard
const typing = (el) => el && el.matches && el.matches("input[type=number], input[type=text], textarea, select");
document.addEventListener("keydown", (e) => {
  if (typing(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($("#calDialog").classList.contains("show")) { if (e.key === "Escape") calClose(); return; }
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) toggleStartStop(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); nudge(1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); nudge(-1); }
  else if ((e.key === "m" || e.key === "M") && !e.repeat && connected()) cmd("meeting");
  else if ((e.key === "p" || e.key === "P") && !e.repeat && connected()) cmd("pause");
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing(e.target)) e.preventDefault(); });

// theme: system, dark, light
const THEME_ICON = { system: "#i-auto", dark: "#i-moon", light: "#i-sun" };
function setTheme(name) {
  THEME = name; savePref("dw-theme", name);
  document.documentElement.dataset.theme = name;
  $("#themeBtn use").setAttribute("href", THEME_ICON[name]);
  const dark = name === "dark" || (name === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
  $('meta[name="theme-color"]').setAttribute("content", dark ? "#0B0D10" : "#F3F4F6");
  $$("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.value === name));
}
$("#themeBtn").addEventListener("click", () => setTheme({ system: "dark", dark: "light", light: "system" }[THEME]));
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => setTheme(THEME));

// clock
const tickClock = () => setText($("#clock"), new Date().toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" }));
setInterval(tickClock, 1000);

// keep the screen on where the browser allows it
let wakeLock = null;
document.addEventListener("pointerdown", async () => { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } } catch (e) {} });

// start
setTheme(THEME);
applyI18n();
tickClock();
showView(location.hash.slice(1) || "training");
loadChart();
connectStream();
</script>
</body>
</html>
